name: Publish release

# Whenever new installers land in downloads/, list them on the Releases page too.
on:
  push:
    branches: [main]
    paths: ['downloads/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(jq -r .version downloads/version.json)
          NOTES="Mac (M1 vagy újabb): HushMoney-Mac.dmg · Windows 10/11: HushMoney-Windows-setup.exe. Telepítési útmutató: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#telepites"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" downloads/HushMoney-Mac.dmg downloads/HushMoney-Windows-setup.exe --clobber
          else
            gh release create "v$V" downloads/HushMoney-Mac.dmg downloads/HushMoney-Windows-setup.exe --title "Hush Money v$V" --notes "$NOTES" --latest
          fi
